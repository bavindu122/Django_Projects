<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Blog Home
      {% endblock %}
    </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <!-- Custom CSS -->
    {% block styles %}

    {% endblock %}
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home:home' %}">My Blog</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link {% block home_active %}

                {% endblock %}"
                href="{% url 'home:home' %}">
                Home
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% block blog_active %}

                {% endblock %}"
                href="{% url 'blog:blog' %}">
                Blog
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% block about_active %}

                {% endblock %}"
                href="{% url 'home:about' %}">
                About
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% block contact_active %}

                {% endblock %}"
                href="{% url 'home:contact' %}">
                Contact
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    {% block content %}

    {% endblock %}

    {% include 'home/footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
